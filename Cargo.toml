[workspace]
resolver = "3"
members = [
    "crates/okrates-core",
    "crates/okrates-models",
    "crates/okrates-python",
    "crates/okrates-schema",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
rand_chacha = "0.10.0"
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.dev.package.okrates-models]
opt-level = 1
