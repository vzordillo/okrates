name: python

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Minimum supported Python (abi3-py310) and the newest tested one.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # rustup reads rust-toolchain.toml; the parity tests run `cargo run`.
      - run: rustup show
      - run: python -m pip install maturin==1.16.0 pytest==9.2.0
      - run: maturin build --locked --interpreter python --out dist
      # numpy is a runtime dependency; install it from PyPI, then okrates only from dist/.
      - run: python -m pip install "numpy>=2.2"
      - run: python -m pip install --no-index --find-links dist okrates
      - run: python -c "import okrates, sys; print(okrates.__file__); sys.exit('okrates' not in okrates.__file__ or 'site-packages' not in okrates.__file__)"
      - run: python -m pytest -q python/tests
      - run: python examples/python/vacancy_diffusivity.py
