<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>One residence-time step in Engine::step_observing</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#787880"/>
    </marker>
  </defs>

  <!-- 1 total rate -->
  <rect x="20" y="16" width="440" height="66" rx="8" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="36" y="40" fill="#2a78d6" font-weight="700" font-size="15">1  Total rate</text>
  <text x="36" y="62" fill="#787880">catalog.prepare_total() returns R = Σ r_i over active events</text>
  <path d="M460,49 L548,49" stroke="#787880" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="468" y="42" fill="#787880" font-size="12">R = 0</text>
  <rect x="550" y="16" width="230" height="66" rx="8" fill="#787880" fill-opacity="0.12" stroke="#787880" stroke-width="1"/>
  <text x="564" y="40" fill="#787880" font-weight="700">Step::Absorbed</text>
  <text x="564" y="62" fill="#787880">no random numbers drawn</text>

  <path d="M240,82 L240,104" stroke="#787880" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- 2 select -->
  <rect x="20" y="106" width="760" height="104" rx="8" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="36" y="130" fill="#2a78d6" font-weight="700" font-size="15">2  Select an event with u₁</text>
  <text x="36" y="152" fill="#787880">On a copy of the RNG: u₁ = open01() in (0, 1). Pick the smallest i with u₁·R &lt; r₁ + … + rᵢ.</text>
  <text x="36" y="176" fill="#787880"><tspan font-weight="700">DirectCatalog</tspan>: linear scan of the rate list, O(M).</text>
  <text x="36" y="196" fill="#787880"><tspan font-weight="700">SumTreeCatalog</tspan>: descend the binary SumTree: left if target &lt; left sum, else subtract it and go right, O(log M).</text>

  <path d="M240,210 L240,232" stroke="#787880" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- 3 time -->
  <rect x="20" y="234" width="760" height="66" rx="8" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="36" y="258" fill="#2a78d6" font-weight="700" font-size="15">3  Draw the waiting time with u₂</text>
  <text x="36" y="280" fill="#787880">u₂ = open01(),  Δt = −ln(u₂) / R.  A copy of the TwoSum Clock advances by Δt.</text>

  <path d="M240,300 L240,322" stroke="#787880" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- 4 apply -->
  <rect x="20" y="324" width="760" height="104" rx="8" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="36" y="348" fill="#2a78d6" font-weight="700" font-size="15">4  Apply the event and update the catalog</text>
  <text x="36" y="370" fill="#787880">catalog.apply_and_update(model, state, selection)</text>
  <text x="36" y="394" fill="#787880"><tspan font-weight="700">DirectCatalog</tspan>: model.apply(); every rate is re-enumerated at the next step 1.</text>
  <text x="36" y="414" fill="#787880"><tspan font-weight="700">SumTreeCatalog</tspan>: apply_reversible(), check slot_count, re-rate only affected_slots, set them in the tree.</text>

  <path d="M240,428 L240,450" stroke="#787880" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M780,376 L796,376 L796,486 L782,486" stroke="#d95926" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- 5 commit -->
  <rect x="20" y="452" width="440" height="58" rx="8" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="36" y="476" fill="#2a78d6" font-weight="700" font-size="15">5  Commit</text>
  <text x="36" y="497" fill="#787880">rng, clock, steps ← copies; Step::Fired { event, dt }</text>

  <rect x="480" y="452" width="300" height="58" rx="8" fill="#d95926" fill-opacity="0.10" stroke="#d95926" stroke-width="1.5"/>
  <text x="494" y="476" fill="#d95926" font-weight="700">On error: Err(SimError)</text>
  <text x="494" y="497" fill="#787880">state undone; rng, clock, steps unchanged</text>
</svg>
